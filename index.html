<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Poster</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        .poster {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .poster img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>

<body>

    <div class="poster">
        <img src="poster.jpg" alt="Poster">
    </div>

</body>
</html>
